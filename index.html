<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf7">
<title>My Expenses</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#fffaf7;--card:#fff;--text:#2d2a28;--muted:#8b8580;--line:#eee7e2;--accent:#8f7cf7;--accent2:#f6f0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans Thai",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:20px 18px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.title{font-size:24px;font-weight:800}.month{color:var(--muted);font-size:14px;margin-top:4px}
.iconbtn{border:0;background:#fff;border:1px solid var(--line);width:42px;height:42px;border-radius:14px;font-size:20px}
.total{background:linear-gradient(135deg,#f1ebff,#fff);border:1px solid #eee5ff;border-radius:24px;padding:22px;margin-bottom:16px}.label{font-size:13px;color:var(--muted)}.amount{font-size:38px;font-weight:850;margin-top:4px;letter-spacing:-1px}
.row{display:flex;gap:10px;overflow:auto;margin:0 0 18px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:13px}.pill.active{background:var(--text);color:#fff;border-color:var(--text)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:14px}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cardtitle{font-weight:750}.small{font-size:12px;color:var(--muted)}
.category{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#fffaf7;border-radius:16px}.catleft{display:flex;gap:8px;align-items:center}.emoji{font-size:20px}
.search{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px 14px;font-size:15px;outline:none;background:#fff}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itemicon{width:42px;height:42px;border-radius:14px;background:#f6f1ed;display:grid;place-items:center;font-size:20px}.info{flex:1}.note{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:3px}.price{font-weight:750}.empty{text-align:center;color:var(--muted);padding:25px 10px}
.fab{position:fixed;right:20px;bottom:22px;width:62px;height:62px;border-radius:22px;border:0;background:#2d2a28;color:#fff;font-size:30px;box-shadow:0 8px 25px #0002}
.modal{display:none;position:fixed;inset:0;background:#0005;align-items:flex-end;justify-content:center}.sheet{background:#fff;border-radius:28px 28px 0 0;width:min(520px,100%);padding:20px 18px 28px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.input,.select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay{border:1px solid var(--line);background:#fff;padding:12px 5px;border-radius:14px;text-align:center;font-size:13px}.pay.sel{background:var(--accent2);border-color:var(--accent);color:#5c48c7;font-weight:700}.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;border:0;border-radius:15px;padding:14px;font-size:15px;font-weight:700}.cancel{background:#f4f1ef}.save{background:#2d2a28;color:#fff}
@media(min-width:700px){.app{padding-top:35px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="title">My Expenses ✦</div><div class="month" id="month"></div></div><button class="iconbtn" onclick="manageCards()">💳</button></header>
<div class="total"><div class="label">ค่าใช้จ่ายเดือนนี้</div><div class="amount" id="total">฿0</div></div>
<div class="row"><button class="pill active" onclick="setRange('month',this)">เดือนนี้</button><button class="pill" onclick="setRange('all',this)">ทั้งหมด</button></div>
<div class="card"><div class="cardhead"><div class="cardtitle">สรุปตามหมวด</div><div class="small" id="count"></div></div><div class="category" id="cats"></div></div>
<div class="card"><div class="cardhead"><div class="cardtitle">รายการล่าสุด</div></div><input class="search" id="search" placeholder="🔎 ค้นหาจากโน้ต / หมวด / วิธีจ่าย" oninput="render()"><div id="items"></div></div>
</div>
<button class="fab" onclick="openModal()">＋</button>

<div class="modal" id="modal"><div class="sheet">
<h2>เพิ่มรายจ่าย</h2>
<div class="field"><label>จำนวนเงิน (บาท)</label><input class="input" id="amount" type="number" inputmode="decimal" placeholder="0.00"></div>
<div class="field"><label>วันที่</label><input class="input" id="date" type="date"></div>
<div class="field"><label>จ่ายด้วย</label><div class="paygrid">
<button class="pay sel" data-pay="cash" onclick="selectPay(this)">💵<br>เงินสด</button>
<button class="pay" data-pay="card" onclick="selectPay(this)">💳<br>บัตร</button>
<button class="pay" data-pay="bank" onclick="selectPay(this)">🏦<br>โอน</button>
</div></div>
<div class="field" id="cardField" style="display:none"><label>บัตรเครดิต</label><select class="select" id="card"></select></div>
<div class="field"><label>หมวดหมู่</label><select class="select" id="category"></select></div>
<div class="field"><label>โน้ต</label><input class="input" id="note" placeholder="เช่น กินชาบู / ซื้อเซรั่ม"></div>
<div class="actions"><button class="btn cancel" onclick="closeModal()">ยกเลิก</button><button class="btn save" onclick="saveExpense()">บันทึก</button></div>
</div></div>
<script>
const cats=[['🍜','ค่ากิน'],['✨','สกินแคร์'],['🛍️','ของใช้'],['🚗','ค่ารถ'],['🏠','บ้าน'],['🎮','ความบันเทิง'],['✈️','ท่องเที่ยว'],['📦','อื่นๆ']];
let expenses=JSON.parse(localStorage.getItem('expenses')||'[]');
let cards=JSON.parse(localStorage.getItem('cards')||'["บัตรเครดิตหลัก"]');
let pay='cash',range='month';
const baht=n=>'฿'+Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function init(){
 document.getElementById('month').textContent=new Date().toLocaleDateString('th-TH',{month:'long',year:'numeric'});
 document.getElementById('category').innerHTML=cats.map(c=>`<option value="${c[1]}">${c[0]} ${c[1]}</option>`).join('');
 render(); 
}
function selectPay(el){document.querySelectorAll('.pay').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');pay=el.dataset.pay;document.getElementById('cardField').style.display=pay==='card'?'block':'none';}
function openModal(){document.getElementById('modal').style.display='flex';document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('card').innerHTML=cards.map(c=>`<option>${c}</option>`).join('');}
function closeModal(){document.getElementById('modal').style.display='none';}
function saveExpense(){
 const amount=Number(document.getElementById('amount').value); if(!amount){alert('กรุณาใส่จำนวนเงิน');return}
 const c=cats.find(x=>x[1]===document.getElementById('category').value);
 expenses.unshift({id:Date.now(),amount,date:document.getElementById('date').value,pay,card:pay==='card'?document.getElementById('card').value:'',category:c[1],emoji:c[0],note:document.getElementById('note').value.trim()});
 localStorage.setItem('expenses',JSON.stringify(expenses));document.getElementById('amount').value='';document.getElementById('note').value='';closeModal();render();
}
function setRange(r,el){range=r;document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function filtered(){
 let arr=expenses;
 if(range==='month'){let d=new Date();let ym=d.toISOString().slice(0,7);arr=arr.filter(e=>e.date.startsWith(ym))}
 const q=document.getElementById('search').value.toLowerCase().trim();
 if(q)arr=arr.filter(e=>(e.note+' '+e.category+' '+e.pay+' '+e.card).toLowerCase().includes(q));
 return arr;
}
function render(){
 const arr=filtered(), total=arr.reduce((s,e)=>s+e.amount,0);
 document.getElementById('total').textContent=baht(total);document.getElementById('count').textContent=arr.length+' รายการ';
 document.getElementById('cats').innerHTML=cats.map(c=>{let v=arr.filter(e=>e.category===c[1]).reduce((s,e)=>s+e.amount,0);return `<div class="cat"><div class="catleft"><span class="emoji">${c[0]}</span><span>${c[1]}</span></div><b>${baht(v)}</b></div>`}).join('');
 document.getElementById('items').innerHTML=arr.length?arr.map(e=>`<div class="item"><div class="itemicon">${e.emoji}</div><div class="info"><div class="note">${e.note||e.category}</div><div class="meta">${new Date(e.date).toLocaleDateString('th-TH')} · ${e.pay==='cash'?'เงินสด':e.pay==='bank'?'โอน':'บัตร '+e.card}</div></div><div class="price">${baht(e.amount)}</div></div>`).join(''):'<div class="empty">ยังไม่มีรายการในช่วงนี้<br>กด ＋ เพื่อเพิ่มรายจ่าย</div>';
}
function manageCards(){
 const name=prompt('เพิ่มชื่อบัตรเครดิต เช่น KBank Visa');if(name&&name.trim()){cards.push(name.trim());localStorage.setItem('cards',JSON.stringify(cards));alert('เพิ่มบัตรแล้ว: '+name.trim())}
}
init();
</script>
</body>
</html>
