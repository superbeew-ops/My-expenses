<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><title>My Expenses</title>
<style>
:root{--bg:#fffaf7;--card:#fff;--ink:#292624;--muted:#928b85;--line:#eee7e2;--lav:#eee8ff;--purple:#765ee8;--green:#5f9b73;--pink:#e8899b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans Thai",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 100px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px}.title{font-size:25px;font-weight:850}.sub{font-size:13px;color:var(--muted);margin-top:3px}.headBtns{display:flex;gap:8px}.circle{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:19px}
.total{border:1px solid #e6ddff;background:linear-gradient(135deg,#eee8ff,#fff);border-radius:25px;padding:20px 21px;margin-bottom:13px}.label{font-size:13px;color:var(--muted)}.big{font-size:38px;font-weight:900;letter-spacing:-1.5px;margin:2px 0 8px}.monthNav{display:flex;align-items:center;justify-content:space-between}.monthNav button{border:0;background:transparent;font-size:18px;padding:4px 9px}.monthName{font-weight:750}
.paySummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.payCard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px 8px}.payCard .p{font-size:12px;color:var(--muted)}.payCard b{display:block;margin-top:4px;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin:13px 0}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.ctitle{font-size:17px;font-weight:800}.link{border:0;background:none;color:var(--purple);font-weight:700}
.category{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cat{padding:12px;border-radius:16px;background:#fffaf7}.catTop{display:flex;align-items:center;gap:7px;font-size:13px}.cat b{display:block;margin-top:5px;font-size:15px}.bar{height:5px;background:#eee8e4;border-radius:10px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#8f7cf7;border-radius:10px}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;font-size:15px;background:#fff;outline:none}.item{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}.item:last-child{border-bottom:0}.ico{width:44px;height:44px;border-radius:15px;background:#f6f1ed;display:grid;place-items:center;font-size:21px}.info{flex:1;min-width:0}.note{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-weight:800;font-size:14px}.empty{text-align:center;color:var(--muted);padding:24px 8px}
.fab{position:fixed;right:max(20px,calc((100vw - 560px)/2 + 18px));bottom:22px;width:62px;height:62px;border:0;border-radius:22px;background:#292624;color:#fff;font-size:31px;box-shadow:0 9px 28px #0003}
.modal{display:none;position:fixed;inset:0;background:#0005;align-items:flex-end;justify-content:center;z-index:5}.sheet{background:#fff;border-radius:28px 28px 0 0;width:min(560px,100%);padding:19px 17px 28px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.input,.select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay{border:1px solid var(--line);background:#fff;padding:11px 4px;border-radius:14px;text-align:center;font-size:12px}.pay.sel{background:var(--lav);border-color:#b9aaff;color:#604bd0;font-weight:800}.actions{display:flex;gap:9px;margin-top:16px}.btn{flex:1;border:0;border-radius:15px;padding:14px;font-size:15px;font-weight:800}.cancel{background:#f2efed}.save{background:#292624;color:#fff}.danger{background:#fff0f2;color:#c84d68}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#292624;color:#fff;padding:11px 15px;border-radius:14px;font-size:13px;display:none;z-index:10;white-space:nowrap}
.listBtn{width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:14px;text-align:left;margin-top:7px}
</style>
</head>
<body>
<div class="app">
<header><div><div class="title">My Expenses ✦</div><div class="sub">บันทึกง่าย ดูเงินตัวเองชัด ๆ</div></div><div class="headBtns"><button class="circle" onclick="backup()">↥</button><button class="circle" onclick="manageCards()">💳</button></div></header>

<div class="total"><div class="label">ค่าใช้จ่ายเดือนนี้</div><div class="big" id="total">฿0.00</div><div class="monthNav"><button onclick="changeMonth(-1)">‹</button><div class="monthName" id="month"></div><button onclick="changeMonth(1)">›</button></div></div>

<div class="paySummary"><div class="payCard"><div class="p">💵 เงินสด</div><b id="cash">฿0</b></div><div class="payCard"><div class="p">💳 บัตร</div><b id="cardTotal">฿0</b></div><div class="payCard"><div class="p">🏦 โอน</div><b id="bank">฿0</b></div></div>

<div class="card"><div class="cardhead"><div class="ctitle">สรุปตามหมวด</div><div class="small" id="count"></div></div><div class="category" id="cats"></div></div>

<div class="card"><div class="cardhead"><div class="ctitle">รายการ</div><button class="link" onclick="clearSearch()">ล้างค้นหา</button></div><input class="search" id="search" placeholder="🔎 ค้นหา เช่น ชาบู / เซรั่ม / KBank" oninput="renderItems()"><div id="items"></div></div>

<div class="card"><div class="cardhead"><div class="ctitle">ข้อมูล</div></div><div class="small">ข้อมูลเก็บในเครื่องนี้เป็นหลัก แนะนำให้สำรองข้อมูลเป็นระยะ</div><button class="listBtn" onclick="backup()">↥ สำรองข้อมูลเป็นไฟล์</button><button class="listBtn" onclick="document.getElementById('restore').click()">↧ นำเข้าข้อมูลจากไฟล์</button><input id="restore" type="file" accept=".json" hidden onchange="restore(event)"></div>
</div>

<button class="fab" onclick="openModal()">＋</button><div class="toast" id="toast"></div>

<div class="modal" id="modal"><div class="sheet">
<h2 id="modalTitle">เพิ่มรายจ่าย</h2>
<div class="field"><label>จำนวนเงิน (บาท)</label><input class="input" id="amount" type="number" inputmode="decimal" placeholder="0.00"></div>
<div class="field"><label>วันที่</label><input class="input" id="date" type="date"></div>
<div class="field"><label>จ่ายด้วย</label><div class="paygrid"><button class="pay sel" data-pay="cash" onclick="selectPay(this)">💵<br>เงินสด</button><button class="pay" data-pay="card" onclick="selectPay(this)">💳<br>บัตรเครดิต</button><button class="pay" data-pay="bank" onclick="selectPay(this)">🏦<br>โอน</button></div></div>
<div class="field" id="cardField" style="display:none"><label>บัตรเครดิต</label><select class="select" id="card"></select></div>
<div class="field"><label>หมวดหมู่</label><select class="select" id="category"></select></div>
<div class="field"><label>โน้ต</label><input class="input" id="note" placeholder="เช่น กินชาบู / ซื้อเซรั่ม"></div>
<div class="actions"><button class="btn cancel" onclick="closeModal()">ยกเลิก</button><button class="btn save" onclick="saveExpense()">บันทึก</button></div>
<button id="deleteBtn" class="btn danger" style="display:none;width:100%;margin-top:9px" onclick="deleteExpense()">ลบรายการนี้</button>
</div></div>

<script>
const CATS=[['🍜','ค่ากิน'],['✨','สกินแคร์'],['🛍️','ของใช้'],['🚗','ค่ารถ'],['🏠','บ้าน'],['🎮','ความบันเทิง'],['✈️','ท่องเที่ยว'],['📦','อื่นๆ']];
let expenses=JSON.parse(localStorage.getItem('expenses')||'[]');
let cards=JSON.parse(localStorage.getItem('cards')||'["บัตรเครดิตหลัก"]');
let pay='cash', editing=null, view=new Date();
const baht=n=>'฿'+Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function monthKey(){return view.getFullYear()+'-'+String(view.getMonth()+1).padStart(2,'0')}
function monthText(){return view.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}
function init(){document.getElementById('category').innerHTML=CATS.map(c=>`<option value="${c[1]}">${c[0]} ${c[1]}</option>`).join('');render()}
function render(){document.getElementById('month').textContent=monthText();let arr=expenses.filter(e=>e.date.startsWith(monthKey()));let total=arr.reduce((s,e)=>s+e.amount,0);document.getElementById('total').textContent=baht(total);document.getElementById('count').textContent=arr.length+' รายการ';['cash','bank'].forEach(p=>document.getElementById(p).textContent=baht(arr.filter(e=>e.pay===p).reduce((s,e)=>s+e.amount,0)));document.getElementById('cardTotal').textContent=baht(arr.filter(e=>e.pay==='card').reduce((s,e)=>s+e.amount,0));let max=Math.max(1,...CATS.map(c=>arr.filter(e=>e.category===c[1]).reduce((s,e)=>s+e.amount,0)));document.getElementById('cats').innerHTML=CATS.map(c=>{let v=arr.filter(e=>e.category===c[1]).reduce((s,e)=>s+e.amount,0);return `<div class="cat"><div class="catTop"><span>${c[0]}</span>${c[1]}</div><b>${baht(v)}</b><div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div></div>`}).join('');renderItems()}
function renderItems(){let q=document.getElementById('search').value.toLowerCase().trim(),arr=expenses.filter(e=>e.date.startsWith(monthKey()));if(q)arr=arr.filter(e=>(e.note+' '+e.category+' '+e.card+' '+payText(e.pay)).toLowerCase().includes(q));arr.sort((a,b)=>b.id-a.id);document.getElementById('items').innerHTML=arr.length?arr.map(e=>`<div class="item" onclick="editExpense(${e.id})"><div class="ico">${e.emoji}</div><div class="info"><div class="note">${esc(e.note||e.category)}</div><div class="meta">${formatDate(e.date)} · ${payText(e.pay,e.card)} · ${e.category}</div></div><div class="price">${baht(e.amount)}</div></div>`).join(''):'<div class="empty">ยังไม่มีรายการ<br>กด ＋ เพื่อเพิ่มรายจ่าย</div>'}
function payText(p,c){return p==='cash'?'เงินสด':p==='bank'?'โอนจากธนาคาร':'บัตร '+c}
function formatDate(s){return new Date(s+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);document.getElementById('search').value='';render()}
function clearSearch(){document.getElementById('search').value='';renderItems()}
function selectPay(el){document.querySelectorAll('.pay').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');pay=el.dataset.pay;document.getElementById('cardField').style.display=pay==='card'?'block':'none'}
function fillCards(){document.getElementById('card').innerHTML=cards.map(c=>`<option>${esc(c)}</option>`).join('')}
function openModal(id=null){editing=id;document.getElementById('modal').style.display='flex';fillCards();document.getElementById('deleteBtn').style.display=id?'block':'none';if(id){let e=expenses.find(x=>x.id===id);document.getElementById('modalTitle').textContent='แก้ไขรายจ่าย';document.getElementById('amount').value=e.amount;document.getElementById('date').value=e.date;document.getElementById('category').value=e.category;document.getElementById('note').value=e.note;pay=e.pay;document.querySelectorAll('.pay').forEach(x=>x.classList.toggle('sel',x.dataset.pay===pay));document.getElementById('cardField').style.display=pay==='card'?'block':'none';document.getElementById('card').value=e.card}else{document.getElementById('modalTitle').textContent='เพิ่มรายจ่าย';document.getElementById('amount').value='';document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('note').value='';pay='cash';document.querySelectorAll('.pay').forEach(x=>x.classList.toggle('sel',x.dataset.pay==='cash'));document.getElementById('cardField').style.display='none'}}
function closeModal(){document.getElementById('modal').style.display='none';editing=null}
function saveExpense(){let amount=Number(document.getElementById('amount').value);if(!amount){toast('กรุณาใส่จำนวนเงิน');return}let c=CATS.find(x=>x[1]===document.getElementById('category').value);let obj={id:editing||Date.now(),amount,date:document.getElementById('date').value,pay,card:pay==='card'?document.getElementById('card').value:'',category:c[1],emoji:c[0],note:document.getElementById('note').value.trim()};if(editing){let i=expenses.findIndex(x=>x.id===editing);expenses[i]=obj}else expenses.unshift(obj);persist();closeModal();render();toast(editing?'แก้ไขรายการแล้ว':'บันทึกรายการแล้ว')}
function editExpense(id){openModal(id)}
function deleteExpense(){if(!editing)return;if(confirm('ลบรายการนี้ใช่ไหม?')){expenses=expenses.filter(e=>e.id!==editing);persist();closeModal();render();toast('ลบรายการแล้ว')}}
function manageCards(){let name=prompt('ชื่อบัตรใหม่ เช่น KBank Visa');if(name&&name.trim()){cards.push(name.trim());persist();toast('เพิ่มบัตร '+name.trim()+' แล้ว')}}
function persist(){localStorage.setItem('expenses',JSON.stringify(expenses));localStorage.setItem('cards',JSON.stringify(cards))}
function backup(){let data={version:2,exportedAt:new Date().toISOString(),expenses,cards};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-expenses-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('สำรองข้อมูลแล้ว')}
function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.expenses)||!Array.isArray(d.cards))throw 0;expenses=d.expenses;cards=d.cards;persist();render();toast('นำเข้าข้อมูลแล้ว')}catch(e){alert('ไฟล์สำรองไม่ถูกต้อง')}};r.readAsText(f);ev.target.value=''}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
init();
</script>
</body></html>
